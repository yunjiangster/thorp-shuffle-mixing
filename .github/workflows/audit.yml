name: Audit checks

on:
  push:
    paths:
      - "checks/**"
      - "requirements.txt"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "checks/**"
      - "requirements.txt"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Run verifier
        run: python checks/verify_audit.py
